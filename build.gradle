// Pengaturan bersama untuk semua modul (core dan lwjgl3).
subprojects {
    apply plugin: 'java'

    group = 'id.girah'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }

    // Bisa di-build dengan JDK 17 ke atas; bytecode selalu target Java 17
    // supaya jalan di semua laptop anggota kelompok.
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }
}
