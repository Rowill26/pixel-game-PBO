apply plugin: 'java-library'

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    // Font TTF pixel (monogram) untuk HUD, dialog, dan layar judul
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Naskah di assets/cerita diperiksa oleh SemuaNaskahAssetsTest: test harus dijalankan ulang
    // setiap kali naskah berubah, bukan hanya saat kode berubah.
    inputs.files(fileTree(rootProject.file('assets/cerita')))
          .withPropertyName('naskahCerita')
          .withPathSensitivity(PathSensitivity.RELATIVE)
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
